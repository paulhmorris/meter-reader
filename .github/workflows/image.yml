name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The image is deployed by whoever pulls it, so it must carry no one's configuration.
  no-baked-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: DATABASE_URL=postgresql://build npm run db:generate
      - name: Build with canary secrets
        env:
          PUBLIC_SENTRY_DSN: https://canary@canary.ingest.sentry.io/424242
          PUBLIC_SENTRY_ENVIRONMENT: canary
          VAPID_PUBLIC_KEY: canary-vapid-public-key
        run: npm run build --workspace apps/web
      - name: Fail if the build inlined them
        run: |
          if grep -rl "canary" apps/web/build; then
            echo "::error::build-time value reached the bundle; use \$env/dynamic, not \$env/static"
            exit 1
          fi
          echo "no build-time configuration in the bundle"

  push:
    needs: no-baked-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
